services:
  caddy-proxy:
    container_name: external-caddy-proxy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../webapp/staticfiles:/webapp/staticfiles
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Read-only: only the expanded HTML is public; law.db / graph.db stay private
      # (the Caddyfile serves /laws/* from /data/legislatie-descarcata/3-expanded).
      # Data lives at the repo root, one level above this compose file.
      - ../legislatie-descarcata/3-expanded:/data/legislatie-descarcata/3-expanded:ro
      # PDF sources and the generated Docling graph viewer are public too.
      - ../legislatie-descarcata/5-pdfs:/data/legislatie-descarcata/5-pdfs:ro
      - ../legislatie-descarcata/4-processed/graph-docling:/data/legislatie-descarcata/4-processed/graph-docling:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  chatcodfiscal-app:
    container_name: chatcodfiscal-app
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        INSTALL_OCR: 0
    restart: unless-stopped
    command: ["scrapper-legislatie-just-web"]
    environment:
      SCRAPPER_DATA_DIR: /data/legislatie-descarcata
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?set ADMIN_SECRET_KEY in .env}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:?set TOKEN_SIGNING_SECRET in .env}
      PUBLIC_LAWS_BASE_URL: https://mcp.chatcodfiscal.ro/laws
      MCP_ALLOWED_HOSTS: mcp.chatcodfiscal.ro,mcp.chatcodfiscal.ro:*,localhost,localhost:*
      SCRAPPER_PDF_SOURCES_DIR: /data/pdf_sources
      WEB_WORKERS: ${WEB_WORKERS:-2}
      TZ: Europe/Bucharest
    volumes:
      # Bind mount so the index is visible both in the container and on the host.
      - ../legislatie-descarcata:/data/legislatie-descarcata
      - ../pdf_sources:/data/pdf_sources:ro
    networks:
      - web

  chatcodfiscal-indexer:
    container_name: chatcodfiscal-indexer
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        INSTALL_OCR: 1
    restart: unless-stopped
    command: ["scrapper-legislatie-just-indexer"]
    environment:
      SCRAPPER_DATA_DIR: /data/legislatie-descarcata
      SCRAPPER_PDF_SOURCES_DIR: /data/pdf_sources
      TZ: Europe/Bucharest
      # OCR of base64 images in downloaded HTML; needs the `ocr` extra.
      REINDEX_OCR: ${REINDEX_OCR:-1}
      # Set to 1 for the first launch to build the index immediately.
      REINDEX_ON_START: ${REINDEX_ON_START:-0}
    volumes:
      # Bind mount so reindexing done in the container is reflected on the host.
      - ../legislatie-descarcata:/data/legislatie-descarcata
      - ../pdf_sources:/data/pdf_sources:ro
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
