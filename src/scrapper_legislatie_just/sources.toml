[[sources]]
numar_link = 286044
nume = "NORME GENERALE din 5 noiembrie 2015 de întocmire și utilizare a documentelor financiar-contabile (Anexa nr.1)"
slug = "norme-generale-de-utilizare-a-documentelor-financiar-contabile-anexa-1"
descriere = """
Acest document stabilește regulile obligatorii pentru întocmirea, utilizarea și arhivarea documentelor financiar-contabile în România, detaliind elementele obligatorii pe care trebuie să le conțină un document justificativ pentru a fi valabil. Acesta reglementează modul de completare a registrelor contabile (Jurnal, Inventar, Cartea Mare), procedurile de corectare a erorilor și termenele legale de păstrare a documentelor în arhivă. De asemenea, normele prevăd pașii necesari pentru reconstituirea documentelor pierdute și criteriile tehnice pe care trebuie să le îndeplinească software-urile de contabilitate.
"""

[[sources]]
numar_link = 164320
nume = "OMFP nr. 1.802/2014 – Reglementări contabile"
slug = "reglementari-contabile"
descriere = """
Acest act normativ reprezintă „biblia” contabilității românești, stabilind regulile detaliate pentru întocmirea situațiilor financiare anuale, atât pentru firme individuale, cât și pentru grupuri de societăți (situații consolidate). Documentul definește principiile contabile, metodele de evaluare a activelor și datoriilor, precum și formatele obligatorii pentru bilanț și contul de profit și pierdere. De asemenea, obligă entitățile să își dezvolte politici contabile proprii și reglementează tratamentul contabil pentru situații specifice, cum ar fi asocierile în participație sau activitatea subunităților fără personalitate juridică.
"""

[[sources]]
numar_link = 303279
nume = "REGLEMENTĂRI CONTABILE din 29 decembrie 2014 privind situațiile financiare anuale individuale și situațiile financiare anuale consolidate"
slug = "reglementari-contabile-situatii-financiare-anuale"
descriere = """
Acest document reprezintă cadrul legal fundamental pentru contabilitatea societăților comerciale din România, stabilind regulile de „alfabetizare” și raportare financiară.
Iată ce găsești, pe scurt, în acest text:

Reguli de Evaluare: Explică exact cum se calculează valoarea bunurilor din firmă în trei momente cheie: când le cumperi (intrare), la inventar și când le vinzi/casezi (ieșire).

Structura Raportărilor: Definește formatul obligatoriu pentru Bilanț și Contul de Profit și Pierdere, dar și pentru Notele explicative, în funcție de mărimea firmei (micro, mici, mijlocii sau mari).

Ghidul Contabilului: Conține Planul de Conturi General (lista tuturor conturilor utilizate) și Funcțiunea Conturilor (instrucțiuni clare despre cum se folosește fiecare cont, ce se scrie pe debit și ce pe credit).

Transparență și Etică: Include capitole moderne despre raportarea durabilității (sustenabilitate), raportarea impozitului pe profit și regulile de audit, asigurând că informațiile financiare sunt calitative, comparabile și oneste.

Este, practic, manualul tehnic care transformă orice activitate economică într-un limbaj financiar standardizat, recunoscut de stat și de bănci.
"""

[[sources]]
numar_link = 303281
nume = "REGLEMENTĂRILE CONTABILE din 12 decembrie 2016 conforme cu Standardele Internaționale de Raportare Financiară (Anexa nr. 1)"
slug = "reglementari-contabile-standarde-internationale-raportare-financiara-anexa-1"
descriere = """
Acest document reprezintă cadrul de raportare premium (IFRS) aplicabil în România, destinat în special companiilor mari și celor listate la bursă, care necesită o transparență internațională.

Iată ce găsești, pe scurt, în acest text:

Raportări Complexe: Detaliază elaborarea situațiilor financiare anuale și consolidate conform IFRS, incluzând Raportul Administratorilor și obligația de a raporta plăți către guverne sau impozitul pe profit pe regiuni.

Sustenabilitate și Viitor: Conține reglementări de ultimă oră privind raportarea de durabilitate (ESG) și digitalizarea raportării prin formatul electronic unic (ESAP).

Reguli de Contabilizare: Oferă instrucțiuni specifice pentru active, provizioane, capitaluri proprii și, esențial, pentru repartizarea profitului și corectarea erorilor contabile.

Instrumente de Lucru: Include un Plan de conturi și Funcțiunea conturilor adaptate standardelor internaționale, asigurând o punte între contabilitatea locală și cea globală.

Documentul funcționează ca un set de reguli riguroase care transformă datele contabile într-un limbaj financiar universal, facilitând investițiile străine și auditul extern de înalt nivel.
"""

