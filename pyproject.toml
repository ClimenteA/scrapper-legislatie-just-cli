[project]
name = "scrapper-legislatie-just-cli"
version = "0.1.0"
description = "CLI for downloading, cleaning, expanding and indexing Romanian legislation from legislatie.just.ro"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.5",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "html5lib>=1.1",
    "pydantic>=2.8.2",
    "tenacity>=9.0.0",
    "unidecode>=1.3.8",
    "loguru>=0.7.2",
    "markdown>=3.7",
    "docling>=2.90.0",
    "easyocr>=1.7.2",
    "lxml>=5.2.0",
    "graphqlite>=0.12.0",
]

[project.scripts]
scrapper-legislatie-just-cli = "scrapper_legislatie_just.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapper_legislatie_just"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
