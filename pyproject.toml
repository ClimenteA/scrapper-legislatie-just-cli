[project]
name = "scrapper-legislatie-just-cli"
version = "0.1.0"
description = "HTTP MCP server over a local index of Romanian legislation from legislatie.just.ro"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Download / clean / expand / process pipeline and query layer.
    "typer>=0.12.5",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "html5lib>=1.1",
    "pydantic>=2.8.2",
    "tenacity>=9.0.0",
    "unidecode>=1.3.8",
    "loguru>=0.7.2",
    "markdown>=3.7",
    "lxml>=5.2.0",
    "graphqlite>=0.12.0",
    "cursvalutarbnr>=1.0.0",
    # OCR of base64 images embedded in downloaded HTML. Required by the
    # pipeline (expand step) and by PDF ingestion, so it is not optional.
    "docling>=2.90.0",
    "easyocr>=1.7.2",
    # Declared directly so the CPU-only source below is applied to them;
    # both are also transitive dependencies of docling/easyocr.
    "torch>=2.2.2,<3",
    "torchvision>=0.5,<1",
    # FastAPI host + Streamable HTTP MCP tool layer.
    "mcp>=2.0,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.8",
    "pyjwt>=2.8.0",
    "apscheduler>=3.10,<4",
]

[project.scripts]
scrapper-legislatie-just-web = "scrapper_legislatie_just.webapp:main"
scrapper-legislatie-just-indexer = "scrapper_legislatie_just.scheduler:main"
scrapper-legislatie-just-actions-index = "scrapper_legislatie_just.actions_fts:main"

# Docling/EasyOCR ruleaza pe CPU in acest proiect. Wheel-urile torch de pe
# PyPI trag dupa ele ~2 GB de pachete nvidia-* (CUDA); indexul CPU oficial
# PyTorch le furnizeaza pe cele fara dependente GPU. `explicit = true` face ca
# acest index sa fie folosit DOAR pentru pachetele mapate mai jos.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapper_legislatie_just"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
