[project]
name = "scrapper-legislatie-just-cli"
version = "0.1.0"
description = "CLI for downloading, cleaning, expanding and indexing Romanian legislation from legislatie.just.ro"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12.5",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "html5lib>=1.1",
    "pydantic>=2.8.2",
    "tenacity>=9.0.0",
    "unidecode>=1.3.8",
    "loguru>=0.7.2",
    "markdown>=3.7",
    "lxml>=5.2.0",
    "graphqlite>=0.12.0",
    "cursvalutarbnr>=1.0.0",
    "mcp>=2.0,<3",
    "fastapi>=0.115",
    "pydantic-settings>=2.8",
    "pyjwt>=2.8.0",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
# Only needed for the local PDF/image tools (read_context) and OCR during
# download/expand. The hosted FastAPI image intentionally skips this extra,
# which avoids pulling in torch and the NVIDIA CUDA wheels (~5 GB).
ocr = [
    "docling>=2.90.0",
    "easyocr>=1.7.2",
]

[project.scripts]
scrapper-legislatie-just-cli = "scrapper_legislatie_just.cli:app"
scrapper-legislatie-just-mcp = "scrapper_legislatie_just.mcp_server:main"
scrapper-legislatie-just-web = "scrapper_legislatie_just.webapp:main"
scrapper-legislatie-just-indexer = "scrapper_legislatie_just.indexer:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapper_legislatie_just"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
