[project]
name = "scrapper-legislatie-just-cli"
version = "0.1.0"
description = "HTTP MCP server over a local index of Romanian legislation from legislatie.just.ro"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Download / clean / expand / process pipeline and query layer.
    "typer>=0.12.5",
    "requests>=2.32.3",
    "beautifulsoup4>=4.12.3",
    "html5lib>=1.1",
    "pydantic>=2.8.2",
    "tenacity>=9.0.0",
    "unidecode>=1.3.8",
    "loguru>=0.7.2",
    "lxml>=5.2.0",
    "cursvalutarbnr>=1.0.0",
    # FastAPI host + Streamable HTTP MCP tool layer.
    "mcp>=2.0,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.8",
    "pyjwt>=2.8.0",
    "apscheduler>=3.10,<4",
    "liteparse>=2.21.1",
    "markdownify>=1.2.4",
    "llama-index-core>=0.14.26",
    "llama-index-retrievers-bm25>=0.9.0",
    "PyStemmer>=2.2.0",
]

[project.scripts]
scrapper-legislatie-just-web = "scrapper_legislatie_just.webapp:main"
scrapper-legislatie-just-indexer = "scrapper_legislatie_just.scheduler:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapper_legislatie_just"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
