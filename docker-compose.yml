services:
  caddy-proxy:
    container_name: external-caddy-proxy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./webapp/staticfiles:/webapp/staticfiles
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Read-only: the public web server only needs the expanded HTML.
      - legislatie_data:/data/legislatie-descarcata:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

  chatcodfiscal-app:
    container_name: chatcodfiscal-app
    build:
      context: .
      args:
        INSTALL_OCR: 0
    restart: unless-stopped
    command: ["scrapper-legislatie-just-web"]
    environment:
      SCRAPPER_DATA_DIR: /data/legislatie-descarcata
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?set ADMIN_SECRET_KEY in .env}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:?set TOKEN_SIGNING_SECRET in .env}
      PUBLIC_LAWS_BASE_URL: https://mcp.chatcodfiscal.ro/laws
      MCP_ALLOWED_HOSTS: mcp.chatcodfiscal.ro,mcp.chatcodfiscal.ro:*,localhost,localhost:*
      WEB_WORKERS: ${WEB_WORKERS:-2}
      TZ: Europe/Bucharest
    volumes:
      - legislatie_data:/data/legislatie-descarcata
    networks:
      - web

  chatcodfiscal-indexer:
    container_name: chatcodfiscal-indexer
    build:
      context: .
      args:
        INSTALL_OCR: 1
    restart: unless-stopped
    command: ["scrapper-legislatie-just-indexer"]
    environment:
      SCRAPPER_DATA_DIR: /data/legislatie-descarcata
      TZ: Europe/Bucharest
      # OCR of base64 images in downloaded HTML; needs the `ocr` extra.
      REINDEX_OCR: ${REINDEX_OCR:-1}
      # Set to 1 for the first launch to build the index immediately.
      REINDEX_ON_START: ${REINDEX_ON_START:-0}
    volumes:
      - legislatie_data:/data/legislatie-descarcata
    networks:
      - web

volumes:
  legislatie_data:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
