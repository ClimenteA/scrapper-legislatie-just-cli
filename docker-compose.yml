services:
  legislatie-app:
    container_name: legislatie-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["scrapper-legislatie-just-web"]
    ports:
      - "8000:8000"
    environment:
      SCRAPPER_DATA_DIR: /data/legislatie-descarcata
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?set ADMIN_SECRET_KEY in .env}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:?set TOKEN_SIGNING_SECRET in .env}
      # Prefix used for every link returned by the MCP tools. FastAPI serves
      # the expanded HTML and source PDFs from this same host.
      PUBLIC_LAWS_BASE_URL: ${PUBLIC_LAWS_BASE_URL:-http://localhost:8000/laws}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:8000}
      MCP_DISABLE_DNS_REBINDING: ${MCP_DISABLE_DNS_REBINDING:-0}
      WEB_WORKERS: ${WEB_WORKERS:-2}
      TZ: Europe/Bucharest
    volumes:
      # Bind mount so the index (including 0-pdfs/ source PDFs) is visible
      # both in the container and on the host.
      - ./legislatie-descarcata:/data/legislatie-descarcata
    networks:
      - legislatie

  legislatie-indexer:
    container_name: legislatie-indexer
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["scrapper-legislatie-just-indexer"]
    environment:
      SCRAPPER_DATA_DIR: /data/legislatie-descarcata
      # PDF corpus now lives inside the data folder (0-pdfs/).
      SCRAPPER_PDF_SOURCES_DIR: /data/legislatie-descarcata/0-pdfs
      TZ: Europe/Bucharest
      # OCR of base64 images in downloaded HTML (always available in the image).
      REINDEX_OCR: ${REINDEX_OCR:-1}
      # Set to 1 for the first launch to build the index immediately.
      REINDEX_ON_START: ${REINDEX_ON_START:-0}
    volumes:
      - ./legislatie-descarcata:/data/legislatie-descarcata
    networks:
      - legislatie

networks:
  legislatie:
    driver: bridge
